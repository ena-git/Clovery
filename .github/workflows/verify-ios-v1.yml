name: Verify Clovery iOS 1.1.0 Account Upgrade

"on":
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verify-ios-1.1.0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-ios:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
      CLOVERY_RELEASE_API_BASE_URL: https://api.clovery.cn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-go@v6
        with:
          go-version-file: v2/services/api/go.mod
          cache-dependency-path: v2/services/api/go.sum
      - name: Verify iOS 1.1.0 account upgrade
        run: scripts/verify-ios-1.1.0.sh
