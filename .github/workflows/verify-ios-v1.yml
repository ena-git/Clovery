name: Verify Clovery iOS 1.1.0 Account Upgrade

"on":
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verify-ios-1.1.0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-ios:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
      CLOVERY_RELEASE_API_BASE_URL: https://api.clovery.cn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-go@v6
        with:
          go-version-file: v2/services/api/go.mod
          cache-dependency-path: v2/services/api/go.sum
      - name: Verify repository hygiene
        run: scripts/verify-repository-hygiene.sh
      - name: Verify Go API and OpenAPI
        working-directory: v2/services/api
        run: |
          go test ./...
          go build -o /tmp/clovery-api ./cmd/api
      - name: Reject beta Xcode
        run: |
          xcode_version=$(xcodebuild -version)
          selected_developer_dir=$(xcode-select -p)
          printf '%s\n' "$xcode_version"
          printf 'Selected developer directory: %s\n' "$selected_developer_dir"
          if printf '%s\n%s\n' "$xcode_version" "$selected_developer_dir" | grep -qi beta; then
            echo "Beta Xcode is not allowed for native iOS verification." >&2
            exit 1
          fi
      - name: Verify iOS 1.1.0 account upgrade
        run: scripts/verify-ios-v1.sh
