name: clovery-v2

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: clovery
      POSTGRES_USER: clovery
      POSTGRES_PASSWORD: clovery_dev_only
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clovery -d clovery"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: clovery_minio
      MINIO_ROOT_PASSWORD: clovery_dev_only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:9000/minio/health/live >/dev/null"]
      interval: 2s
      timeout: 2s
      retries: 15

  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set local http://minio:9000 clovery_minio clovery_dev_only; do sleep 1; done;
      /usr/bin/mc mb --ignore-existing local/clovery-dev;
      /usr/bin/mc anonymous set none local/clovery-dev;
      "

volumes:
  postgres-data:
  minio-data:
